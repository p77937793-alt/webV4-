<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一水千田｜桌遊試玩</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="images/drop.svg" type="image/svg+xml">
<!-- v4：全站的設計變數與字型（DESIGN_SYSTEM.md） -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<link rel="stylesheet" href="css/tokens.css">

<!--
  《一水千田》桌遊試玩（卡牌示範）
  - 卡牌內容在下方 <script id="default-data"> 裡（JSON）。
  - 開發者模式的入口已隱藏：按 Ctrl＋Shift＋D，或在網址後面加上 #dev（例如 play.html#dev）。
-->
<style>
/* ===================== 0. 設計變數（和網站同一套） ===================== */
:root{
  --ink:#13212b; --ink-2:#4a5660; --muted:#7d8790; --deep:#0b2233; --deep-2:#123a52;
  --blue:#2b7bb9; --blue-2:#1d5f94; --teal:#3aa6b9; --red:#b5532d; --green:#5d8f2f; --gold:#c9962b;
  --paper:#f4efe4; --paper-2:#ebe4d6; --line:rgba(19,33,43,.1);
  --role:#8a5a2b; --project:#2b6cb0; --dev:#2f855a; --event:#c05621; --memory:#6b46c1;
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.8); --glass-line:rgba(255,255,255,.75);
  --blur:saturate(1.6) blur(18px);
  --glow:0 0 0 1px rgba(255,255,255,.6) inset,0 1px 0 rgba(255,255,255,.9) inset;
  --shadow-1:0 1px 1px rgba(19,33,43,.04),0 6px 18px -6px rgba(19,33,43,.14);
  --shadow-2:0 2px 4px rgba(19,33,43,.05),0 24px 48px -16px rgba(19,33,43,.3);
  --r-sm:10px; --r:16px; --r-lg:24px;
  --ease:cubic-bezier(.22,.8,.3,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --font:"Noto Sans TC","Microsoft JhengHei","微軟正黑體","PingFang TC",system-ui,sans-serif;
}
@supports (transition-timing-function:linear(0,1)){
  :root{--spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1)}
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);font-size:15px;line-height:1.6;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;
  background:radial-gradient(36vmax 36vmax at 10% 15%,rgba(58,166,185,.2),transparent 60%),
             radial-gradient(32vmax 32vmax at 90% 30%,rgba(43,123,185,.16),transparent 60%),
             radial-gradient(38vmax 38vmax at 60% 95%,rgba(181,83,45,.1),transparent 60%);
  animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3vmax,-2vmax,0) rotate(8deg)}}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:.02em}
p{margin:0 0 .7em}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:14px}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--glow),var(--shadow-1)}
.panel{border-radius:var(--r-lg);padding:18px}
.ptitle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--blue-2);margin:0 0 12px}
.ptitle i{font-style:normal;font-size:16px}
.ptitle .sp{flex:1}

/* ===================== 1. 按鈕、輸入框 ===================== */
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:0 18px;border-radius:999px;font-weight:700;letter-spacing:.04em;white-space:nowrap;
  background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line) inset,0 2px 6px -2px rgba(19,33,43,.12);
  transition:transform .45s var(--spring),box-shadow .25s,background .25s,color .25s,opacity .25s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 0 1px rgba(43,123,185,.35) inset,0 10px 20px -10px rgba(19,33,43,.35);color:var(--blue-2)}
.btn:active:not(:disabled){transform:scale(.94);transition-duration:.1s}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 10px 22px -10px var(--blue),0 1px 0 rgba(255,255,255,.25) inset}
.btn.primary:hover:not(:disabled){background:var(--blue-2);color:#fff;box-shadow:0 16px 30px -12px var(--blue),0 1px 0 rgba(255,255,255,.25) inset}
.btn.primary::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s var(--ease)}
.btn.primary:hover::before{transform:translateX(120%)}
.btn.ghost{background:transparent;box-shadow:none;color:inherit}
.btn.ghost:hover:not(:disabled){background:rgba(43,123,185,.1);box-shadow:none}
.btn.danger{color:#b42318}
.btn.danger.primary{background:#c2412d;color:#fff;box-shadow:0 10px 22px -10px #c2412d}
.btn.big{min-height:54px;padding:0 32px;font-size:17px}
.btn.small{min-height:32px;padding:0 12px;font-size:13px}
.btn.on{background:var(--ink);color:#fff}
.ripple{position:absolute;z-index:-1;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);pointer-events:none;animation:ripple .7s var(--ease) forwards}
.btn:not(.primary) .ripple{background:rgba(43,123,185,.2)}
@keyframes ripple{to{transform:scale(1);opacity:0}}
input,select,textarea{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:rgba(255,255,255,.85);
  transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(43,123,185,.15)}
textarea{width:100%;resize:vertical}
:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.7);box-shadow:0 0 0 1px var(--line) inset;white-space:nowrap}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;letter-spacing:.04em}
.b-史料{background:#2f855a}.b-待核{background:#d97706}.b-遊戲化{background:#6b7280}

/* ===================== 2. 上方列 ===================== */
.topbar{position:sticky;top:10px;z-index:30;margin:10px auto 0;width:min(1500px,calc(100% - 20px));
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:58px;padding:8px 10px 8px 18px;border-radius:999px;
  background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--glow),var(--shadow-1)}
.logo{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:900;letter-spacing:.12em;color:var(--blue);text-decoration:none;white-space:nowrap}
.logo img{width:24px;transition:transform .6s var(--spring)}
.logo:hover img{transform:rotate(-12deg) translateY(-2px)}
.topbar .sp{flex:1}
.rounds{display:flex;gap:4px;align-items:center}
.rounds i{width:9px;height:9px;border-radius:999px;background:rgba(43,123,185,.2);transition:width .5s var(--spring),background .3s}
.rounds i.past{background:var(--blue)}
.rounds i.now{width:24px;background:linear-gradient(90deg,var(--teal),var(--blue))}
.flow{color:var(--blue-2)}
.flow.dry{color:var(--red)}
.flow .drop{display:inline-block;animation:drip 2.2s ease-in-out infinite}
@keyframes drip{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

/* ===================== 3. 首頁 ===================== */
.hero{position:relative;overflow:hidden;isolation:isolate;margin:10px;border-radius:32px;color:#fff;min-height:calc(100vh - 20px);
  display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:30px;padding:clamp(40px,6vw,80px) clamp(24px,6vw,90px) 120px;
  background:radial-gradient(120% 120% at 0% 0%,#1f6fa5 0%,var(--deep) 55%,#06141f 100%)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.35;
  background:url("images/ex-hero.jpg") center/cover;mix-blend-mode:luminosity;mask-image:linear-gradient(90deg,transparent,#000 70%)}
.hero .back{position:absolute;left:24px;top:22px;color:#fff;text-decoration:none;font-size:14px;opacity:.85;display:flex;gap:6px;align-items:center;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);transition:background .2s}
.hero .back:hover{background:rgba(255,255,255,.2);opacity:1}
.eyebrow{display:inline-block;padding:6px 16px;border-radius:999px;font-size:13px;letter-spacing:.3em;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.26);margin-bottom:18px}
.hero h1{font-size:clamp(54px,8vw,108px);font-weight:900;letter-spacing:.12em;line-height:1.05}
.hero h1 .ch{display:inline-block;animation:char-in 1s var(--spring) both;animation-delay:calc(.1s + var(--i)*.08s)}
@keyframes char-in{from{opacity:0;transform:translateY(.5em) scale(.9);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.hero .lead{font-size:clamp(16px,1.6vw,20px);opacity:.9;margin:18px 0 30px;max-width:30em}
.hero .btns{display:flex;flex-wrap:wrap;gap:12px}
.hero .btn:not(.primary){background:rgba(255,255,255,.12);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.35) inset}
.hero .btn:not(.primary):hover{background:rgba(255,255,255,.22);color:#fff}
.hero .stats{display:flex;gap:28px;margin-top:40px;flex-wrap:wrap}
.hero .stats b{display:block;font-size:34px;font-weight:900;line-height:1.1;background:linear-gradient(180deg,#fff,#bfe6f0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .stats span{font-size:13px;opacity:.75}
.fan{position:relative;height:440px}
.fan .card{position:absolute;left:50%;top:50%;margin:-147px 0 0 -105px;transition:transform .8s var(--spring);box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.fan .card:nth-child(1){transform:translate(-62%,4%) rotate(-14deg);animation:float 7s ease-in-out infinite}
.fan .card:nth-child(2){transform:translate(0,-6%) rotate(0deg);z-index:2;animation:float 7s ease-in-out -2.3s infinite}
.fan .card:nth-child(3){transform:translate(62%,4%) rotate(14deg);animation:float 7s ease-in-out -4.6s infinite}
.fan:hover .card:nth-child(1){transform:translate(-82%,2%) rotate(-18deg)}
.fan:hover .card:nth-child(3){transform:translate(82%,2%) rotate(18deg)}
.fan:hover .card:nth-child(2){transform:translate(0,-10%) scale(1.04)}
@keyframes float{50%{margin-top:-157px}}
.wave{position:absolute;left:0;bottom:-1px;width:200%;height:90px;z-index:-1}
.wave path{fill:var(--paper)}
.wave .w1{opacity:.4;animation:wave 14s linear infinite}
.wave .w2{animation:wave 9s linear infinite reverse}
@keyframes wave{to{transform:translateX(-50%)}}
.about{width:min(1100px,calc(100% - 40px));margin:30px auto 60px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.about .panel h3{font-size:17px;margin-bottom:8px;color:var(--blue-2)}
.about .panel p{color:var(--ink-2);margin:0;font-size:14.5px}
.about .num{font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--blue);background:rgba(43,123,185,.1);padding:3px 10px;border-radius:999px;display:inline-block;margin-bottom:10px}

/* ===================== 4. 開局設定 ===================== */
.setup{width:min(980px,calc(100% - 32px));margin:24px auto 60px}
.setup h1{font-size:clamp(30px,4vw,44px);font-weight:900;text-align:center;margin:20px 0 6px}
.setup .sub{text-align:center;color:var(--ink-2);margin-bottom:24px}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.7);box-shadow:0 0 0 1px var(--line) inset;gap:2px}
.seg button{min-width:52px;height:40px;border-radius:999px;font-weight:800;transition:background .3s,color .3s,transform .4s var(--spring)}
.seg button:active{transform:scale(.92)}
.seg button.on{background:var(--blue);color:#fff;box-shadow:0 8px 16px -8px var(--blue)}
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:22px 0}
.seat{border-radius:var(--r-lg);padding:18px;animation:pop .6s var(--spring) both;animation-delay:calc(var(--i)*.06s)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.seat .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;font-size:18px;margin-bottom:12px;box-shadow:0 8px 18px -8px var(--pc)}
.seat input,.seat select{width:100%;margin-top:6px}
.seat .rdesc{font-size:13px;color:var(--ink-2);margin-top:10px;min-height:3.2em}
.setup .go{display:flex;justify-content:center;gap:12px;margin-top:10px}
.warn{color:#b42318;text-align:center}

/* ===================== 5. 遊戲畫面 ===================== */
.game{width:min(1500px,calc(100% - 20px));margin:14px auto 40px;display:grid;grid-template-columns:300px minmax(0,1fr) 320px;gap:14px;align-items:start}
.game>*{min-width:0}
/* 公共建設：一條水路，完成一段就有水流過 */
.route{--fill:0;position:relative;list-style:none;margin:0;padding:0 0 0 34px}
.route::before,.route::after{content:"";position:absolute;left:12px;top:14px;bottom:14px;width:4px;border-radius:4px}
.route::before{background:rgba(43,123,185,.14)}
.route::after{background:linear-gradient(180deg,var(--teal),var(--blue));transform-origin:top;transform:scaleY(var(--fill));transition:transform 1s var(--ease)}
.node{position:relative;margin-bottom:10px;border-radius:var(--r);padding:12px 14px;transition:all .5s var(--ease)}
.node .dot{position:absolute;left:-34px;top:12px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;
  background:var(--paper);border:3px solid rgba(43,123,185,.3);color:var(--blue-2);z-index:1;transition:all .5s var(--spring)}
.node.done .dot{background:var(--blue);border-color:#fff;color:#fff;box-shadow:0 0 0 4px rgba(43,123,185,.18),0 0 16px rgba(58,166,185,.6)}
.node.cur{background:#fff;box-shadow:0 0 0 2px var(--project),var(--shadow-2)}
.node.cur .dot{background:#fff;border-color:var(--project);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(43,107,176,.15)}}
.node.locked{opacity:.55}
.node .nname{font-weight:800;display:flex;gap:6px;align-items:center}
.node .yr{font-size:11.5px;color:var(--muted);font-weight:600}
.bar{height:7px;background:rgba(19,33,43,.08);border-radius:9px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--teal),var(--blue));transition:width .8s var(--spring)}
.needs{display:grid;gap:6px;margin-top:10px}
.need{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13.5px;padding:6px 6px 6px 10px;border-radius:12px;background:rgba(43,123,185,.06)}
.need .ic{font-size:18px}
.need.ok{background:rgba(47,133,90,.1);color:#2f855a}
.goal{text-align:center;padding:16px;border-radius:var(--r);background:linear-gradient(135deg,rgba(58,166,185,.2),rgba(43,123,185,.2));font-weight:800;color:var(--blue-2)}

/* 目前玩家 */
.me{border-radius:28px;padding:22px}
.mehead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mehead .av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:900;color:#fff;background:var(--pc);box-shadow:0 10px 22px -10px var(--pc)}
.mehead h2{font-size:26px;font-weight:900}
.mehead .score{margin-left:auto;text-align:right}
.mehead .score b{display:block;font-size:30px;font-weight:900;color:var(--red);line-height:1}
.mehead .score small{font-size:12px;color:var(--muted)}
.harvest{display:flex;gap:10px;align-items:flex-start;margin:16px 0 0;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,rgba(93,143,47,.12),rgba(201,150,43,.1));font-size:14px}
.harvest .hi{font-size:22px;line-height:1}
.mid{display:grid;grid-template-columns:1fr auto;gap:16px;margin-top:16px;align-items:stretch}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.rt{position:relative;border-radius:16px;padding:10px 6px 8px;text-align:center;background:#fff;box-shadow:0 0 0 1px var(--line) inset;transition:transform .4s var(--spring)}
.rt:hover{transform:translateY(-3px)}
.rt .ic{font-size:26px;line-height:1.1;display:block}
.rt b{display:block;font-size:22px;font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums}
.rt small{font-size:11.5px;color:var(--muted)}
.rt.zero b{color:#c3c8cc}
.tank{min-width:150px;border-radius:16px;padding:10px 14px;background:linear-gradient(180deg,#eaf5fb,#d7ebf7);box-shadow:0 0 0 1px rgba(43,123,185,.2) inset}
.tank .tl{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--blue-2)}
.drops{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px;max-width:150px}
.drops i{width:16px;height:16px;border-radius:50% 0 50% 50%;transform:rotate(-45deg);background:rgba(43,123,185,.18);transition:background .4s,transform .5s var(--spring)}
.drops i.on{background:linear-gradient(135deg,var(--teal),var(--blue));transform:rotate(-45deg) scale(1.05)}
.tank small{font-size:12px;color:var(--ink-2)}
.lands{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.land{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.7);box-shadow:0 0 0 1px var(--line) inset;font-size:13.5px}
.land b{font-size:16px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.act{border-radius:20px;padding:14px;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px var(--line) inset}
.act .row{gap:6px}
.act select,.act input{padding:6px 10px}
.market{margin-top:16px}
.mk{display:flex;gap:14px;overflow-x:auto;padding:6px 4px 12px;scroll-snap-type:x proximity}
.slot{display:flex;flex-direction:column;gap:8px;align-items:center;scroll-snap-align:start}
.slot .why{font-size:12px;color:#b42318;min-height:1.4em;text-align:center;max-width:210px}
.slot.cant .card{filter:saturate(.5);opacity:.75}
.endbar{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:18px}
.endbar .muted{font-size:13px}

/* 右欄 */
.evcard{display:flex;justify-content:center}
.players .pl{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:16px;transition:background .3s}
.players .pl.active{background:#fff;box-shadow:0 0 0 2px var(--pc),var(--shadow-1)}
.players .pl .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;background:var(--pc)}
.players .pl small{display:block;color:var(--muted);font-size:12px;line-height:1.5}
.players .pl .sc{font-size:20px;font-weight:900;color:var(--red)}
.players .pl .sb{grid-column:2/4;height:4px;border-radius:4px;background:rgba(19,33,43,.07);overflow:hidden}
.players .pl .sb i{display:block;height:100%;background:var(--pc);transition:width .8s var(--spring)}
.log{max-height:320px;overflow:auto;font-size:13px;line-height:1.6;margin:0 -6px;padding:0 6px}
.log div{padding:6px 0;border-bottom:1px solid var(--line);animation:fadein .5s var(--ease)}
.log div:first-child{color:var(--ink)}
.log b.r{display:inline-block;min-width:26px;font-size:11px;color:#fff;background:var(--blue);border-radius:999px;text-align:center;margin-right:4px}
@keyframes fadein{from{opacity:0;transform:translateY(-6px)}}

/* 數字變動時跳一下 */
.bump{animation:bump .6s var(--spring)}
.bump.up{color:#2f855a}
.bump.down{color:#b42318}
@keyframes bump{30%{transform:scale(1.35)}}

/* ===================== 6. 卡牌 ===================== */
.card{--c:#999;color:var(--ink);position:relative;flex:none;width:210px;height:294px;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-align:left;

.card .cn{color:#fff;font-size:17px;font-weight:900;padding:2px 12px 0;line-height:1.25;min-height:30px;display:flex;align-items:center}
.card .img{height:70px;margin:12px 10px 0;border-radius:10px;background:#eee center/cover no-repeat;flex:none}
.card .cost{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:12px 10px 0;font-size:11.5px;color:var(--muted)}
.card .cost span{background:#fff;box-shadow:0 0 0 1px var(--line) inset;border-radius:8px;padding:1px 6px;color:var(--ink);font-weight:700}
.card .req{font-size:11.5px;color:#b42318;padding:4px 12px 0;font-weight:600}
.card .rule{font-size:12.5px;line-height:1.55;padding:8px 12px;flex:1;overflow:hidden;white-space:pre-line;font-weight:500}
.card .cost+.rule,.card .req+.rule{padding-top:6px}
.card .ch+.cn+.rule{padding-top:14px}
.card .hist{font-size:10.5px;line-height:1.45;color:#5b5348;background:rgba(201,150,43,.12);margin:0 8px 8px;padding:6px 8px;border-radius:10px;max-height:80px;overflow:hidden}

.card .st{position:absolute;right:8px;bottom:8px;z-index:2}

.card.big{transform:scale(1.2);transform-origin:top left;margin:0 42px 59px 0}
.card.res .bigic{font-size:64px;text-align:center;margin-top:20px}
.card.res .tile{text-align:center;color:var(--muted);font-size:12px}
.card.memory .tn{display:grid;gap:6px;padding:12px 10px 8px;font-size:12px;flex:1}
.card.memory .tn div{background:#fff;box-shadow:0 0 0 1px var(--line) inset;border-radius:10px;padding:6px 8px}
.card.memory .tn b{color:var(--memory)}
.hov .card:hover,.card.hov:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 0 0 1px rgba(19,33,43,.08) inset,0 26px 40px -16px rgba(19,33,43,.45)}
.gallery{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.gallery .card{cursor:zoom-in}

/* ===================== 7. 覆蓋層、對話框 ===================== */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(6,20,31,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadeIn .3s var(--ease)}
@keyframes fadeIn{from{opacity:0}}
.modal{width:min(640px,100%);max-height:90vh;overflow:auto;border-radius:28px;padding:26px;background:rgba(255,253,248,.94);box-shadow:var(--shadow-2);animation:rise .5s var(--spring)}

.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900;display:grid;place-items:center;font-size:13px}
/* 回合開場 */
.splash{width:min(760px,100%);border-radius:32px;padding:30px;color:#fff;text-align:center;overflow:hidden;position:relative;isolation:isolate;
  background:radial-gradient(120% 120% at 50% 0%,#2a86bf,var(--deep) 70%);box-shadow:0 40px 80px -30px rgba(0,0,0,.6);animation:rise .6s var(--spring)}
.splash::after{content:"";position:absolute;left:50%;top:100%;width:150%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.15);transform:translate(-50%,-50%) scale(.2);animation:ring 6s var(--ease) infinite;z-index:-1}

.splash .btn{margin-top:18px}
.zoomwrap{display:flex;justify-content:center;padding:10px 0}
.zoomwrap .card{transform:scale(1.45);margin:68px 0 70px;animation:none}

/* 全螢幕（卡牌一覽、開發者模式） */
.full{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--paper);animation:fadeIn .25s var(--ease)}
.full .fhead{display:flex;align-items:center;gap:8px;padding:12px 16px;flex-wrap:wrap;background:var(--deep);color:#fff}
.full .fhead b{font-size:16px;margin-right:6px}

/* ===================== 8. 結算 ===================== */
.end{width:min(1100px,calc(100% - 32px));margin:24px auto 60px;text-align:center}
.end .result{border-radius:32px;padding:clamp(30px,5vw,56px) 24px;color:#fff;position:relative;overflow:hidden;isolation:isolate;animation:rise .7s var(--spring)}
.end .result.win{background:radial-gradient(120% 120% at 50% 0%,#3aa6b9,#1d5f94 55%,var(--deep))}
.end .result.lose{background:radial-gradient(120% 120% at 50% 0%,#b5732d,#6b3a1f 55%,#2a1a10)}
.end .result h1{font-size:clamp(40px,6vw,72px);font-weight:900;letter-spacing:.1em}
.end .result p{opacity:.9;font-size:17px;margin:10px 0 0}
.end .result .rip{position:absolute;inset:0;z-index:-1}
.end .result .rip i{position:absolute;left:50%;top:50%;width:120%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.2);transform:translate(-50%,-50%) scale(.1);animation:ring2 5s var(--ease) infinite}
.end .result .rip i:nth-child(2){animation-delay:1.6s}.end .result .rip i:nth-child(3){animation-delay:3.2s}

.rank{display:grid;gap:10px;margin:22px 0;text-align:left}

.rank .rr.head{background:none;box-shadow:none;border:0;font-size:12px;color:var(--muted);font-weight:700;padding-top:0;padding-bottom:0;animation:none}
.rank .pos{font-size:22px;font-weight:900;color:var(--blue-2)}
.rank .tot{font-size:26px;font-weight:900;color:var(--red);text-align:right}
.rank .c{text-align:center}
.end h2{margin:36px 0 8px;font-size:26px}
.end .btns{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}

/* ===================== 9. 開發者模式 ===================== */
.ed{display:grid;grid-template-columns:250px 1fr 300px;gap:14px;align-items:start}
.ed .list{max-height:calc(100vh - 120px);overflow:auto}
.ed .list .it{padding:8px 10px;border-radius:12px;cursor:pointer;display:flex;gap:6px;align-items:center;transition:background .2s}

.ed .form{max-height:calc(100vh - 120px);overflow:auto}

.ed .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ed .effrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#fff;box-shadow:0 0 0 1px var(--line) inset;border-radius:12px;padding:8px;margin-top:6px}
.ed .effrow input{width:76px}
.ed .effrow input.w{width:150px}
.ed .costgrid{display:flex;gap:8px;flex-wrap:wrap}
.ed .costgrid label{margin:0;display:flex;align-items:center;gap:4px}
.ed .costgrid input{width:60px}
.edpanel{max-width:820px}
.edpanel table{width:100%;border-collapse:collapse}
.edpanel td{padding:4px}
.issues li{margin:6px 0}
.tip{font-size:12px;color:var(--muted);margin-top:3px}
.setrow{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
.setrow>span:first-child{width:260px}

.toast{position:fixed;left:50%;bottom:24px;z-index:99;transform:translateX(-50%);padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;color:#fff;
  background:rgba(11,34,51,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 14px 30px -12px rgba(0,0,0,.5);animation:toast .5s var(--spring)}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px) scale(.9)}}

/* ===================== 10. 平板、手機 ===================== */
@media (max-width:1180px){
  .game{grid-template-columns:1fr 1fr}

}

}

}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}

<script>
"use strict";
/* =====================================================================
   《一水千田》桌遊試玩
   1. 基本設定　2. 資料載入／儲存　3. 小工具　4. 卡牌外觀
   5. 畫面：首頁、開局、遊戲、結算、卡牌一覽、規則
   6. 遊戲邏輯　7. 開發者模式（入口隱藏：Ctrl＋Shift＋D 或網址加 #dev）
   8. 互動事件　9. 啟動
   ===================================================================== */

/* ================= 1. 基本設定 ================= */
const LS_KEY = 'yishui-cards-v1';
const TYPES = {
  role:{label:'人物角色卡',short:'角色',hex:'#8a5a2b'},
  project:{label:'公共建設卡',short:'公共建設',hex:'#2b6cb0'},
  dev:{label:'個人發展卡',short:'個人發展',hex:'#2f855a'},
  event:{label:'歷史事件卡',short:'歷史事件',hex:'#c05621'},
  memory:{label:'今昔對照卡',short:'今昔對照',hex:'#6b46c1'}
};
const STATUSES = ['史料','待核','遊戲化'];
const STAT_LABEL = {vp:'分數',riceBonus:'每塊水田收成',contribBonus:'投入公共建設每份貢獻分',extraDraw:'每回合多抽資源卡'};
const TARGETS = {self:'自己',all:'每位玩家',others:'其他玩家'};
const EFFECTS = {
  gain:{label:'獲得資源',p:['target','res','n']},
  lose:{label:'失去資源',p:['target','res','n','unless']},
  stat:{label:'增減數值（田、埤塘、分數…）',p:['target','stat','n']},
  draw:{label:'抽資源卡',p:['target','n']},
  income:{label:'每回合固定收入（持續）',p:['res','n']},
  water:{label:'獲得水滴',p:['target','n']},
  waterLoseAll:{label:'失去所有水滴',p:['target','unless']},
  noWater:{label:'本回合不配水',p:[]},
  waterMod:{label:'本回合配水增減',p:['n']},
  projectCost:{label:'目前公共建設需求增加',p:['res','n']},
  contribMult:{label:'本回合貢獻分倍數',p:['n']},
  fieldBonus:{label:'本回合每塊水田多收稻米',p:['n']},
  tradeRatio:{label:'銀行交易比例（持續）',p:['n']},
  note:{label:'只顯示文字（手動處理）',p:['text']}
};
const PCOLORS = ['#2b7bb9','#c05621','#2f855a','#6b46c1'];   // 玩家代表色
const LANDS = [['旱田','🏜','看天田'],['水田','🌾','水田'],['埤塘','💧','埤塘'],['聚落','🏘','聚落'],['輪灌','🔄','輪灌']];

/* ================= 2. 資料載入／儲存 ================= */
const EMBED = JSON.parse(document.getElementById('default-data').textContent);
let DATA;
function clone(o){return JSON.parse(JSON.stringify(o))}
function lsGet(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'null')}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(LS_KEY,JSON.stringify(v));return true}catch(e){toast('⚠ 無法自動儲存（瀏覽器不允許或容量已滿），請記得匯出 JSON');return false}}
let saveTimer=null;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{lsSet({base:EMBED.meta.stamp,saved:new Date().toISOString(),data:DATA})},300)}
function loadData(){
  const s=lsGet();
  if(s&&s.data&&s.base===EMBED.meta.stamp){DATA=s.data;return null}
  DATA=clone(EMBED);
  if(s&&s.data) return s;   // 內建內容換了版本，但瀏覽器裡有舊草稿
  return null;
}
function normalize(){
  DATA.meta=DATA.meta||{};
  DATA.settings=Object.assign({},EMBED.settings,DATA.settings||{});
  DATA.resources=DATA.resources||[];DATA.cards=DATA.cards||[];
  DATA.cards.forEach(c=>{c.effects=c.effects||[];c.cost=c.cost||{};c.requires=c.requires||[];c.copies=c.copies==null?1:c.copies;c.status=c.status||'遊戲化'});
}

/* ================= 3. 小工具 ================= */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function S(){return DATA.settings}
function resById(id){return DATA.resources.find(r=>r.id===id)}
function resName(id){if(id==='water')return '水滴';const r=resById(id);return r?r.name:'（未知資源 '+id+'）'}
function resIcon(id){if(id==='water')return '💧';const r=resById(id);return r?r.icon:'❓'}
function cardById(id){return DATA.cards.find(c=>c.id===id)}
function cardsOf(t){return DATA.cards.filter(c=>c.type===t)}
function statName(s){return STAT_LABEL[s]||s}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(m){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function download(name,text,type){const b=new Blob([text],{type:type||'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function newId(prefix){let i=1;while(DATA.cards.some(c=>c.id===prefix+i))i++;return prefix+i}
function initial(name){const a=Array.from(String(name||'?').trim());return esc(a[a.length-1]||'?')}   // 頭像用名字的最後一個字（玩家一→一）
function pcolor(i){return PCOLORS[i%PCOLORS.length]}
function totalCopies(list){return list.reduce((s,c)=>s+(+c.copies||0),0)}

/* ================= 文字產生 ================= */
function effText(e){
  const tg=TARGETS[e.target]||'自己', n=Number(e.n)||0;
  const un=e.unless?`（持有${String(e.unless).split(',').map(s=>statName(s.trim())).join('或')}者不受影響）`:'';
  switch(e.t){
    case 'gain':return `${tg}獲得 ${n} ${resIcon(e.res)}${resName(e.res)}`;
    case 'lose':return `${tg}失去 ${n} ${resIcon(e.res)}${resName(e.res)}${un}`;
    case 'stat':return `${tg}${statName(e.stat)} ${n>=0?'+':''}${n}`;
    case 'draw':return `${tg}抽 ${n} 張資源卡`;
    case 'income':return `每回合開始獲得 ${n} ${resIcon(e.res)}${resName(e.res)}`;
    case 'water':return `${tg}獲得 ${n} 💧水滴`;
    case 'waterLoseAll':return `${tg}失去所有💧水滴${un}`;
    case 'noWater':return '本回合不配水';
    case 'waterMod':return `本回合配水 ${n>=0?'+':''}${n}`;
    case 'projectCost':return `目前公共建設需求 +${n} ${resIcon(e.res)}${resName(e.res)}`;
    case 'contribMult':return `本回合投入公共建設，貢獻分 ×${n}`;
    case 'fieldBonus':return `本回合每塊水田多收 ${n} 🌾`;
    case 'tradeRatio':return `與銀行交易改為 ${n} 換 1`;
    case 'note':return e.text||'';
  }
  return '';
}
function reqText(r){return r.k==='water'?'已通水':`${statName(r.stat)} ≥ ${r.min}`}
function ruleText(c){
  if(c.text&&c.text.trim())return c.text;
  return (c.effects||[]).map(effText).filter(Boolean).join('\n');
}
function costHTML(cost){
  return Object.entries(cost||{}).filter(([k,v])=>v>0).map(([k,v])=>`<span>${resIcon(k)}×${v}</span>`).join('');
}

// 數字有變動時，讓它跳一下（綠色＝增加、紅色＝減少）
function bumpNumbers(){
  const now={};
  document.querySelectorAll('[data-v]').forEach(el=>{
    const k=el.dataset.v,v=parseFloat(el.textContent);now[k]=v;
    if(k in LASTV&&!isNaN(v)&&v!==LASTV[k]){el.classList.add('bump',v>LASTV[k]?'up':'down');setTimeout(()=>el.classList.remove('bump','up','down'),700)}
  });
  LASTV=now;
}

/* ================= 6. 遊戲邏輯 ================= */
function log(m){G.log.unshift(`<b class="r">R${G.round}</b> ${m}`);if(G.log.length>150)G.log.pop()}
function cur(){return G.players[G.turn]}
function cap(p){return (+S().waterCapBase||0)+(p.stats['埤塘']||0)*(+S().waterPerPond||0)}
function drawRes(n){
  const out=[];
  for(let i=0;i<n;i++){
    const tot=Object.values(G.pool).reduce((a,b)=>a+b,0);
    if(tot<=0)break;
    let x=Math.random()*tot;
    for(const k in G.pool){x-=G.pool[k];if(x<0){G.pool[k]--;out.push(k);break}}
  }
  return out;
}
function give(p,res,n){p.res[res]=(p.res[res]||0)+n;G.pool[res]=Math.max(0,(G.pool[res]||0)-n)}
function pay(p,res,n){n=Math.min(n,p.res[res]||0);p.res[res]-=n;G.pool[res]=(G.pool[res]||0)+n;return n}
function addWater(p,n){const before=p.water;p.water=Math.max(0,Math.min(cap(p),p.water+n));return p.water-before}
function hasAny(p,list){return String(list||'').split(',').map(s=>s.trim()).filter(Boolean).some(s=>(p.stats[s]||0)>0)}
function targets(t,self){if(t==='all')return G.players;if(t==='others')return G.players.filter(p=>p!==self);return self?[self]:G.players}

function applyEffects(effs,self,srcName){
  for(const e of effs||[]){
    const n=Number(e.n)||0;
    switch(e.t){
      case 'gain':targets(e.target,self).forEach(p=>give(p,e.res,n));break;
      case 'lose':targets(e.target,self).forEach(p=>{if(!hasAny(p,e.unless))pay(p,e.res,n)});break;
      case 'stat':targets(e.target,self).forEach(p=>{p.stats[e.stat]=Math.max(0,(p.stats[e.stat]||0)+n)});break;
      case 'draw':targets(e.target,self).forEach(p=>drawRes(n).forEach(r=>p.res[r]=(p.res[r]||0)+1));break;
      case 'income':if(self)self.income[e.res]=(self.income[e.res]||0)+n;break;
      case 'water':targets(e.target,self).forEach(p=>addWater(p,n));break;
      case 'waterLoseAll':targets(e.target,self).forEach(p=>{if(hasAny(p,e.unless)){if(p.stats['輪灌']&&!p.stats['埤塘'])p.water=Math.min(p.water,1)}else p.water=0});break;
      case 'noWater':G.flags.noWater=true;break;
      case 'waterMod':G.flags.waterMod+=n;break;
      case 'projectCost':{const pr=curProject();if(pr){G.extra[pr.id]=G.extra[pr.id]||{};G.extra[pr.id][e.res]=(G.extra[pr.id][e.res]||0)+n}break}
      case 'contribMult':G.flags.contribMult*=n||1;break;
      case 'fieldBonus':G.flags.fieldBonus+=n;break;
      case 'tradeRatio':if(self)self.tradeRatio=n;break;
      case 'note':if(e.text)log('📝 '+esc(e.text));break;
    }
    // 埤塘變少時，超過容量的水會流走
    if(e.t==='stat'&&e.stat==='埤塘')targets(e.target,self).forEach(p=>{p.water=Math.min(p.water,cap(p))});
  }
}
function reqOK(p,reqs){
  return (reqs||[]).every(r=>r.k==='water'?G.flowing:(p.stats[r.stat]||0)>=(Number(r.min)||0));
}
function canAfford(p,cost){return Object.entries(cost||{}).every(([k,v])=>(p.res[k]||0)>=v)}

function projects(){return cardsOf('project')}
function curProject(){return projects().find(c=>!G.done.includes(c.id))||null}
function remaining(pr,res){
  const need=(pr.cost[res]||0)+((G.extra[pr.id]||{})[res]||0)-((G.paid[pr.id]||{})[res]||0);
  return Math.max(0,need);
}
function projectResList(pr){const s=new Set([...Object.keys(pr.cost||{}),...Object.keys(G.extra[pr.id]||{})]);return [...s].filter(k=>(pr.cost[k]||0)+((G.extra[pr.id]||{})[k]||0)>0)}
function projectTotals(pr){let need=0,paid=0;projectResList(pr).forEach(r=>{const tot=(pr.cost[r]||0)+((G.extra[pr.id]||{})[r]||0);need+=tot;paid+=Math.min(tot,(G.paid[pr.id]||{})[r]||0)});return {need,paid}}

function startGame(){
  const s=S();
  const pool={};DATA.resources.forEach(r=>pool[r.id]=+r.copies||0);
  const roleIds=shuffle(cardsOf('role').map(c=>c.id));
  const chosen=SETUP.roles.slice(0,SETUP.n).filter(r=>r!=='random');
  G={round:0,turn:0,players:[],pool,done:[],paid:{},extra:{},flowing:false,log:[],event:null,
     flags:{},devDeck:[],market:[],eventDeck:[],harvest:'',harvestData:null,splash:null,roundInfo:null,over:false};
  for(let i=0;i<SETUP.n;i++){
    let rid=SETUP.roles[i];
    if(rid==='random'){rid=roleIds.find(x=>!chosen.includes(x));if(rid)chosen.push(rid)}
    const p={name:String(SETUP.names[i]||'').trim()||('玩家'+(i+1)),role:rid||null,res:{},water:0,income:{},tradeRatio:null,contrib:0,
      stats:{'旱田':+s.startDry||0,'水田':+s.startWet||0,'埤塘':+s.startPond||0,'聚落':0,vp:0,riceBonus:0,contribBonus:0,extraDraw:0},cards:[]};
    DATA.resources.forEach(r=>p.res[r.id]=0);
    G.players.push(p);
  }
  G.players.forEach(p=>{
    drawRes(+s.startDraw||0).forEach(r=>p.res[r]++);
    const rc=p.role&&cardById(p.role);if(rc)applyEffects(rc.effects,p,rc.name);
  });
  G.devDeck=shuffle(cardsOf('dev').flatMap(c=>Array(Math.max(0,+c.copies||0)).fill(c.id)));
  refillMarket();
  VIEW='game';G.log=[];LASTV={};UI.gTo=null;
  startRound();
}
function refillMarket(){const n=Math.max(0,+S().marketSize||0)||3;while(G.market.length<n&&G.devDeck.length)G.market.push(G.devDeck.pop())}
function drawEvent(){
  if(!G.eventDeck.length)G.eventDeck=shuffle(cardsOf('event').flatMap(c=>Array(Math.max(0,+c.copies||0)).fill(c.id)));
  return G.eventDeck.pop()||null;
}
function startRound(){
  G.round++;
  if(G.round>(+S().maxRounds||8)){return endGame()}
  G.flags={noWater:false,waterMod:0,contribMult:1,fieldBonus:0};
  const eid=drawEvent();G.event=eid;
  const ev=eid&&cardById(eid);
  if(ev){log(`📜 事件：<b>${esc(ev.name)}</b>　${esc(ruleText(ev)).replace(/\n/g,'；')}`);applyEffects(ev.effects,null,ev.name)}
  let water='🏜 還沒通水：先把公共建設蓋好';
  if(G.flowing&&!G.flags.noWater){
    const n=(+S().baseWater||0)+G.flags.waterMod;
    G.players.forEach(p=>addWater(p,n));
    log(`💧 配水：每人 ${n>=0?'+':''}${n}（受埤塘容量限制）`);
    water=`💧 配水：每人 ${n>=0?'+':''}${n}`;
  } else if(G.flowing){log('💧 本回合沒有配水');water='💧 本回合沒有配水'}
  G.roundInfo={n:G.round,event:eid,water};
  G.turn=0;startTurn();
}
function startTurn(){
  const p=cur(),s=S();const got=[];
  drawRes((+s.drawPerTurn||0)+(p.stats.extraDraw||0)).forEach(r=>{p.res[r]++;got.push(resIcon(r))});
  for(const [r,n] of Object.entries(p.income)){give(p,r,n);for(let i=0;i<n;i++)got.push(resIcon(r))}
  let wetRice=0,wetUsed=0;
  for(let i=0;i<(p.stats['水田']||0);i++){
    if(p.water>0){p.water--;wetUsed++;wetRice+=1+(p.stats.riceBonus||0)+G.flags.fieldBonus}
  }
  let dryRice=0;for(let i=0;i<(p.stats['旱田']||0);i++)if(Math.random()<(+s.dryChance||0))dryRice++;
  if(wetRice+dryRice)give(p,'rice',wetRice+dryRice);
  const dryN=p.stats['旱田']||0,wetN=p.stats['水田']||0;
  G.harvestData={got,wetUsed,wetN,wetRice,dryRice,dryN};
  G.harvest=`抽到 ${got.join('')||'—'}；水田 ${wetUsed}/${wetN} 塊有水，收 ${wetRice} 🌾；看天田 ${dryRice}/${dryN} 塊收成。`;
  log(`▶ <b>${esc(p.name)}</b> 收成：${G.harvest}`);
  // 開場畫面：每回合第一位會看到事件卡；多人時每次換人都提示
  G.splash=(G.turn===0||G.players.length>1)?{turn:G.turn,round:G.turn===0?G.roundInfo:null}:null;
}
function endTurn(){
  LASTV={};   // 換人了，數字不要拿上一位玩家來比
  G.turn++;
  if(G.turn>=G.players.length)startRound();else startTurn();
  if(VIEW==='game')window.scrollTo({top:0,behavior:'smooth'});
  render();
}
function contributeOne(res){
  const p=cur(),pr=curProject();if(!pr)return false;
  if((p.res[res]||0)<1||remaining(pr,res)<1)return false;
  pay(p,res,1);
  G.paid[pr.id]=G.paid[pr.id]||{};G.paid[pr.id][res]=(G.paid[pr.id][res]||0)+1;
  const pts=((+S().vpPerContrib||0)+(p.stats.contribBonus||0))*G.flags.contribMult;
  p.contrib+=pts;
  if(projectResList(pr).every(r=>remaining(pr,r)<=0)){
    G.done.push(pr.id);
    log(`🏗 公共建設完成：<b>${esc(pr.name)}</b>`);
    applyEffects(pr.effects,p,pr.name);
    if(pr.unlockWater&&!G.flowing){G.flowing=true;log('💧 <b>通水了！</b>從下一回合開始配水。');toast('💧 通水了！從下一回合開始配水')}
    else toast(`🏗 ${pr.name} 完成！`);
    if(!curProject()){log('🎉 全部公共建設完成，共同目標達成！');toast('🎉 共同目標達成！')}
  }
  return true;
}
function contribute(res){if(contributeOne(res))render()}
function contributeAll(){
  const p=cur();let n=0,guard=0;
  // 依序投入：每次把目前這項建設能投的都投進去（完成後會接著投下一項）
  while(guard++<200){const pr=curProject();if(!pr)break;const r=projectResList(pr).find(x=>remaining(pr,x)>0&&(p.res[x]||0)>0);if(!r)break;contributeOne(r);n++}
  if(n){log(`🏗 ${esc(p.name)} 一次投入 ${n} 份資源`);toast(`投入了 ${n} 份資源`)}else toast('目前沒有可以投入的資源');
  render();
}
function bankTrade(){
  const p=cur();const from=$('#tFrom').value,to=$('#tTo').value;const ratio=p.tradeRatio||+S().bankRatio||4;
  if(from===to)return toast('請選兩種不同的資源');
  if((p.res[from]||0)<ratio)return toast(`${resIcon(from)}${resName(from)} 不夠 ${ratio} 個`);
  pay(p,from,ratio);give(p,to,1);
  log(`🏦 ${esc(p.name)} 用 ${ratio} ${resIcon(from)} 換 1 ${resIcon(to)}`);render();
}
function giveTo(){
  const p=cur();const r=$('#gRes').value,i=+$('#gTo').value,n=Math.max(1,Math.floor(+$('#gN').value||1));const q=G.players[i];
  if(!q||q===p)return toast('請選擇要給的玩家');
  if((p.res[r]||0)<n)return toast(`${resIcon(r)}${resName(r)} 只有 ${p.res[r]||0} 個`);
  p.res[r]-=n;q.res[r]=(q.res[r]||0)+n;
  log(`🤝 ${esc(p.name)} 給 ${esc(q.name)} ${n} ${resIcon(r)}`);toast(`已給 ${q.name} ${n} ${resIcon(r)}`);render();
}
function buy(idx){
  const p=cur();const id=G.market[idx];const c=cardById(id);if(!c)return;
  if(!canAfford(p,c.cost)||!reqOK(p,c.requires))return;
  Object.entries(c.cost||{}).forEach(([k,v])=>pay(p,k,v));
  applyEffects(c.effects,p,c.name);p.cards.push(id);
  G.market.splice(idx,1);refillMarket();
  log(`🛒 ${esc(p.name)} 購買 <b>${esc(c.name)}</b>`);toast(`🛒 買下「${c.name}」`);render();
}
function score(p){return {contrib:p.contrib,vp:p.stats.vp||0,wet:(p.stats['水田']||0)*(+S().vpPerWet||0),get total(){return this.contrib+this.vp+this.wet}}}
function endGame(){G.round=Math.min(G.round,+S().maxRounds||8);G.splash=null;VIEW='end';window.scrollTo({top:0});render()}

function edTabs(){return [...Object.entries(TYPES).map(([k,v])=>[k,v.label]),['resource','資源卡'],['settings','遊戲設定'],['io','匯入／匯出'],['check','內容檢查']]}

function edCardsHTML(type){
  const list=cardsOf(type);
  if(!ED.sel||!list.find(c=>c.id===ED.sel))ED.sel=list[0]?list[0].id:null;

function issues(){
  const out=[];const rids=DATA.resources.map(r=>r.id);
  const ids={};DATA.cards.forEach(c=>{ids[c.id]=(ids[c.id]||0)+1});
  Object.entries(ids).forEach(([k,v])=>{if(v>1)out.push(['err',`編號 ${k} 重複了 ${v} 次`])});
  DATA.cards.forEach(c=>{
    const n=`【${TYPES[c.type]?TYPES[c.type].short:c.type}】${c.name}`;
    if(c.status==='待核')out.push(['warn',`${n}：標為「待核」`+(c.source?`（${c.source}）`:'')]);
    if(c.status==='史料'&&!String(c.source||'').trim())out.push(['err',`${n}：標為史料，但沒有填出處`]);
    Object.keys(c.cost||{}).forEach(k=>{if(c.cost[k]>0&&!rids.includes(k))out.push(['err',`${n}：花費用到不存在的資源 ${k}`])});
    (c.effects||[]).forEach(e=>{if(e.res&&!rids.includes(e.res)&&EFFECTS[e.t]&&EFFECTS[e.t].p.includes('res'))out.push(['err',`${n}：效果用到不存在的資源 ${e.res}`]);if(!EFFECTS[e.t])out.push(['err',`${n}：未知的效果類型 ${e.t}`])});
    if((c.history||'').length>80)out.push(['warn',`${n}：史料文字 ${c.history.length} 字，卡面可能放不下`]);
    if(c.type!=='memory'&&!(c.effects||[]).length&&!String(c.text||'').trim())out.push(['warn',`${n}：沒有效果也沒有規則文字`]);
  });
  DATA.resources.forEach(r=>{if(r.status==='史料'&&!r.source)out.push(['err',`【資源】${r.name}：標為史料，但沒有出處`])});
  if(!rids.includes('rice'))out.push(['err','沒有代號為 rice 的資源：田的收成會出錯']);
  if(!projects().length)out.push(['err','沒有任何公共建設卡，共同目標無法達成']);
  if(projects().length&&!projects().some(c=>c.unlockWater))out.push(['warn','沒有任何公共建設會「通水」，水田永遠沒有水']);
  if(!cardsOf('event').length)out.push(['warn','沒有歷史事件卡']);
  return out;
}

  reqAdd(){const c=cardById(ED.sel);c.requires.push({k:'stat',stat:'旱田',min:1});save();render()},
  reqDel(el){const c=cardById(ED.sel);c.requires.splice(+el.dataset.i,1);save();render()},
  edImgClear(){const c=cardById(ED.sel);c.image='';save();render()},
  resAdd(){let i=1;while(DATA.resources.some(r=>r.id==='res'+i))i++;DATA.resources.push({id:'res'+i,name:'新資源',icon:'📦',tile:'',color:'#888888',copies:10,status:'遊戲化',history:'',source:''});save();render()},
  resDel(el){const r=DATA.resources[+el.dataset.i];const used=DATA.cards.some(c=>(c.cost||{})[r.id]>0||(c.effects||[]).some(e=>e.res===r.id));
    MODAL={html:`<h3>刪除資源「${esc(r.name)}」？</h3>${used?'<p style="color:#b42318">有卡牌用到這個資源，刪除後那些卡會出錯（可到「內容檢查」查看）。</p>':''}<div class="row"><button class="btn" data-act="modalNo">取消</button><button class="btn primary danger" data-act="resDelYes" data-i="${el.dataset.i}">刪除</button></div>`};render()},
  resDelYes(el){DATA.resources.splice(+el.dataset.i,1);MODAL=null;save();render()},
  exportHTML(){exportHTML()},
  exportJSON(){download(`一水千田_卡牌內容_${(DATA.meta.version||'').replace(/\s+/g,'_')}.json`,JSON.stringify(DATA,null,1),'application/json')},
  exportCSV(){exportCSV()},
  pickJSON(){$('#jsonFile').click()},
  resetData(){MODAL={html:'<h3>還原成內建內容？</h3><p>這台電腦上的所有修改都會被清除。</p><div class="row"><button class="btn" data-act="modalNo">取消</button><button class="btn primary danger" data-act="resetYes">還原</button></div>'};render()},
  resetYes(){DATA=clone(EMBED);normalize();ED.sel=null;MODAL=null;save();toast('已還原');render()},
  useSaved(){DATA=MODAL.saved.data;normalize();MODAL=null;save();render()},
  useEmbed(){MODAL=null;save();render()}
};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  if(el.classList.contains('overlay')&&ev.target!==el)return;   // 點對話框內部不關閉
  const f=ACT[el.dataset.act];if(f)f(el,ev);
});
// 按鈕的水波漣漪
document.addEventListener('pointerdown',ev=>{
  const b=ev.target.closest('.btn');if(!b||b.disabled)return;
  const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2.2,d=document.createElement('i');
  d.className='ripple';d.style.cssText=`width:${s}px;height:${s}px;left:${ev.clientX-r.left-s/2}px;top:${ev.clientY-r.top-s/2}px`;
  b.appendChild(d);setTimeout(()=>d.remove(),700);
});
document.addEventListener('input',ev=>{
  const t=ev.target;const c=ED.sel&&cardById(ED.sel);
  if(t.dataset.ui){UI[t.dataset.ui]=t.value;return}
  if(OVER!=='editor'&&t.dataset.setupName==null)return;
  if(t.dataset.f&&c){
    const k=t.dataset.f;
    if(k==='image'&&t.value==='(已上傳圖片)')return;
    c[k]=t.type==='checkbox'?t.checked:t.type==='number'?Math.max(0,+t.value||0):t.value;save();refreshPreview();return;
  }
  if(t.dataset.cost&&c){const v=Math.max(0,+t.value||0);if(v>0)c.cost[t.dataset.cost]=v;else delete c.cost[t.dataset.cost];save();refreshPreview();return}
  if(t.dataset.eff!=null&&c){
    const e=c.effects[+t.dataset.eff];const k=t.dataset.ef;if(!e)return;
    if(k==='t'){const old=e;const n={t:t.value};EFFECTS[t.value].p.forEach(p=>{n[p]=old[p]!=null?old[p]:(p==='target'?(c.type==='event'?'all':'self'):p==='res'?(DATA.resources[0]?DATA.resources[0].id:''):p==='n'?1:'')});c.effects[+t.dataset.eff]=n;save();render();return}
    e[k]=k==='n'?(+t.value||0):t.value;save();refreshPreview();return;
  }
  if(t.dataset.req!=null&&c){
    const r=c.requires[+t.dataset.req];const k=t.dataset.rf;if(!r)return;
    if(k==='k'){r.k=t.value;if(r.k==='water'){delete r.stat;delete r.min}else{r.stat=r.stat||'旱田';r.min=r.min||1}save();render();return}
    r[k]=k==='min'?(+t.value||0):t.value;save();refreshPreview();return;
  }
  if(t.dataset.res!=null&&t.dataset.rf){
    const r=DATA.resources[+t.dataset.res];if(!r)return;r[t.dataset.rf]=t.type==='number'?Math.max(0,+t.value||0):t.value;save();
    if(t.type==='color'||t.dataset.rf==='status')render();return;
  }
  if(t.dataset.set){const k=t.dataset.set;const s=S();s[k]=t.type==='checkbox'?t.checked:t.tagName==='SELECT'?t.value:Math.max(0,+t.value||0);save();return}
  if(t.dataset.meta){DATA.meta[t.dataset.meta]=t.value;save();return}
  if(t.dataset.setupName!=null){SETUP.names[+t.dataset.setupName]=t.value;
    const av=t.closest('.seat')&&t.closest('.seat').querySelector('.av');if(av)av.innerHTML=initial(t.value);return}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.ui){UI[t.dataset.ui]=t.value;return}
  if(t.dataset.setupRole!=null){SETUP.roles[+t.dataset.setupRole]=t.value;render();return}
  if(OVER!=='editor')return;
  if(t.dataset.f==='status'||t.dataset.f==='copies'||t.dataset.f==='unlockWater'){render();return}
  if(t.matches('[data-img]')&&t.files[0]){
    const c=cardById(ED.sel);const fr=new FileReader();
    fr.onload=()=>{const img=new Image();img.onload=()=>{const m=480,sc=Math.min(1,m/Math.max(img.width,img.height));const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      c.image=cv.toDataURL('image/jpeg',.85);save();render()};img.onerror=()=>toast('⚠ 這個檔案不是圖片');img.src=fr.result};
    fr.readAsDataURL(t.files[0]);return;
  }
  if(t.id==='jsonFile'&&t.files[0]){
    const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!Array.isArray(d.cards))throw 0;DATA=d;normalize();ED.sel=null;save();toast('已匯入 '+d.cards.length+' 張卡牌');render()}catch(e){toast('⚠ 這不是正確的卡牌 JSON 檔')}};
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown',ev=>{
  // 隱藏入口：Ctrl＋Shift＋D 開關開發者模式
  if(ev.ctrlKey&&ev.shiftKey&&(ev.key==='D'||ev.key==='d')){ev.preventDefault();if(OVER==='editor'){OVER=null;render()}else openEditor();return}
  if(ev.key==='Escape'){
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)&&OVER==='editor'&&!MODAL)return;   // 編輯文字時按 Esc 不要整個關掉
    if(MODAL){MODAL=null;render()}else if(OVER){OVER=null;render()}else if(VIEW==='game'&&G&&G.splash){G.splash=null;render()}
    return;
  }
  // 卡牌可以用鍵盤放大
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[data-act="zoom"]')){ev.preventDefault();ACT.zoom(ev.target)}
});
window.addEventListener('hashchange',()=>{if(location.hash==='#dev')openEditor()});

/* ================= 9. 啟動 ================= */
const oldDraft=loadData();normalize();
if(location.hash==='#dev')OVER='editor';
if(oldDraft){
  MODAL={saved:oldDraft,html:`<h3>這台電腦有舊的修改草稿</h3><p>這個檔案的內建內容是「${esc(EMBED.meta.version||'')}」，和你上次在這台電腦修改的版本不同（草稿存於 ${esc((oldDraft.saved||'').slice(0,16).replace('T',' '))}）。要用哪一份？</p>
  <div class="row"><button class="btn" data-act="useEmbed">用這個檔案的內容</button><button class="btn primary" data-act="useSaved">繼續用我的草稿</button></div>`};
}
render();
</script>
</body>
